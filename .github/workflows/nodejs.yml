name: Node.js CI

# The repository is public, so these minutes are free: the unit, type, lint and
# format gate runs on every push and every pull request.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  nodejs:
    # Documentation: https://github.com/zakodium/workflows#nodejs
    uses: zakodium/workflows/.github/workflows/nodejs.yml@nodejs-v1
    with:
      lint-check-types: true
      disable-test-package: true
